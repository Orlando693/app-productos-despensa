<main class="page">
  <header class="top-bar">
    <button class="back" type="button" aria-label="Volver a listas" (click)="back.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
    </button>
    <h1>Nueva Lista</h1>
  </header>

  <p class="intro">Crea una lista para organizar lo que necesitas comprar.</p>

  <form class="form" novalidate (submit)="$event.preventDefault(); createList()">
    <app-input
      label="Nombre"
      placeholder="Ej. Supermercado"
      [required]="true"
      [value]="name"
      [error]="nameError"
      (valueChange)="updateName($event)"
      (blurred)="nameTouched = true"
    />

    <app-input
      label="Descripción"
      placeholder="Detalles opcionales"
      [value]="description"
      (valueChange)="description = $event"
    />

    <app-button type="submit" [disabled]="!name.trim()">Crear</app-button>
  </form>
</main>
