<main class="page">
  <app-page-header
    title="Nueva lista"
    subtitle="Crea una lista para organizar tus compras."
    [showBack]="true"
    (back)="volver.emit()" />

  <section class="form">
    <app-ui-input
      label="Nombre"
      placeholder="Ej. Compras del mes"
      [value]="nombre"
      [error]="error"
      (valueChange)="nombre = $event; error = ''" />

    <app-ui-input
      label="Descripción"
      placeholder="Detalles opcionales"
      [value]="descripcion"
      [multiline]="true"
      (valueChange)="descripcion = $event" />

    <div class="actions">
      <app-ui-button fullWidth (pressed)="crearLista()">Crear lista</app-ui-button>
      <app-ui-button variant="secondary" fullWidth (pressed)="volver.emit()">Cancelar</app-ui-button>
    </div>
  </section>
</main>
