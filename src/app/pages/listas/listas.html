<main class="page">
  <header class="page-header">
    <p>Mis compras</p>
    <h1>Listas</h1>
  </header>

  <app-input
    class="search-field"
    type="search"
    inputMode="search"
    placeholder="Buscar listas"
    [value]="search()"
    (valueChange)="search.set($event)"
  />

  <app-button (clicked)="newList.emit()">
    <span class="material-symbols-rounded" aria-hidden="true">add</span>
    Nueva
  </app-button>

  <section class="lists-panel" aria-labelledby="lists-title">
    <div class="section-heading">
      <p>Listas guardadas</p>
      <h2 id="lists-title">Tus listas</h2>
    </div>

    <div class="list-rows">
      @for (list of filteredLists(); track list.id) {
        <button
          class="list-row"
          type="button"
          (click)="listSelected.emit(list.id)"
        >
          <span class="list-icon material-symbols-rounded" aria-hidden="true">shopping_basket</span>
          <span class="list-copy">
            <strong>{{ list.name }}</strong>
            <span>{{ list.description || 'Sin descripción' }}</span>
          </span>
          <span class="list-arrow material-symbols-rounded" aria-hidden="true">chevron_right</span>
        </button>
      } @empty {
        <p class="empty-state">
          {{ search() ? 'No hay listas que coincidan.' : 'Todavía no creaste ninguna lista.' }}
        </p>
      }
    </div>
  </section>
</main>
