<main class="page">
  <app-page-header
    title="Mis listas"
    subtitle="Organiza tus próximas compras" />

  <app-ui-button [fullWidth]="true" (pressed)="nuevaLista.emit()">+ Nueva lista</app-ui-button>

  <section class="lists-section">
    <h2>Tus listas</h2>
    <div class="cards">
      @for (list of store.lists(); track list.id) {
        <app-list-card
          [title]="list.name"
          [description]="list.description"
          [pendingCount]="store.pendingCount(list)"
          (open)="abrirLista.emit(list.id)" />
      } @empty {
        <div class="empty-state">
          <strong>Aún no tienes listas.</strong>
          <span>Crea una para empezar a registrar lo que hace falta.</span>
        </div>
      }
    </div>
  </section>
</main>
