<div class="app-shell">
  <div class="app-content">
    @if (vista === 'listas') {
      <app-listas
        (nuevaLista)="cambiarVista('nueva')"
        (abrirLista)="abrirLista($event)" />
    }

    @if (vista === 'nueva') {
      <app-nueva-lista
        (crear)="crearLista($event)"
        (volver)="cambiarVista('listas')" />
    }

    @if (vista === 'detalle') {
      <app-detalle-lista
        (volver)="cambiarVista('listas')"
        (empezarCompra)="cambiarVista('compra')" />
    }

    @if (vista === 'compra') {
      <app-modo-compra
        (volver)="cambiarVista('detalle')"
        (finalizar)="cambiarVista('detalle')" />
    }

    @if (vista === 'recientes') {
      <app-recientes (abrirLista)="abrirLista($event)" />
    }
  </div>

  @if (vista !== 'nueva' && vista !== 'compra') {
    <app-bottom-nav
      [active]="vista === 'recientes' ? 'recientes' : 'listas'"
      (navigate)="navegar($event)" />
  }
</div>
