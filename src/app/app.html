@if (view === 'lists') {
  <app-listas
    [lists]="lists"
    (newList)="showNewList()"
    (listSelected)="openList($event)"
  />
}

@if (view === 'new-list') {
  <app-nueva-lista
    (create)="createList($event)"
    (back)="backToLists()"
  />
}

@if (view === 'list-detail') {
  @if (selectedList; as list) {
    <app-detalle-lista
      [list]="list"
      (itemsChange)="updateItems($event)"
      (back)="backToLists()"
    />
  }
}
